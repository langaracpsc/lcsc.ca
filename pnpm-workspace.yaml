# pnpm 11 reads settings from this file (not the "pnpm" field in package.json).
# It blocks dependency postinstall scripts by default for supply-chain safety.
# These three need theirs to run:
#   esbuild       - Vite's bundler
#   workerd       - the Cloudflare Workers runtime
#   unrs-resolver - native import resolver used by the ESLint config
allowBuilds:
  esbuild: true
  workerd: true
  unrs-resolver: true
